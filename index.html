<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Групповой Чек-лист</title>
    <style>
        /* ... (Весь ваш CSS остается без изменений) ... */
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .wrapper { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #007bff; color: white; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 2px; }
        #addBtn { background: #28a745; color: white; }
        #updateBtn { background: #007bff; color: white; }
        #alertBox { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .input-row input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 30%; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>📋 Общий чек-лист</h2>
    <div id="alertBox"></div>
    
    <div class="input-row">
        <input type="text" id="newCol1" placeholder="Ситуация">
        <input type="text" id="newCol2" placeholder="Решение">
        <input type="text" id="newCol3" placeholder="Цель">
        <button id="addBtn">➕ Добавить</button>
    </div>

    <table id="myTable">
        <thead><tr><th>Ситуация</th><th>Решение</th><th>Цель</th><th>Управление</th></tr></thead>
        <tbody></tbody>
    </table>
    
    <button id="updateBtn">🔄 Обновить данные</button>
</div>

<script>
    /* --- НАСТРОЙКИ (ОБЯЗАТЕЛЬНО ИЗМЕНИТЬ) --- */
    const REPO_OWNER = 'cherepanka'; 
    const REPO_NAME = 'my-checklist';
    const WORKFLOW_FILE = 'save-from-web.yml'; // Имя файла из Шага 2
    const WEBHOOK_SECRET = 'SuperChecklist1997!'; 

    let tableData = [];

    function showAlert(msg, type = 'success') {
        const box = document.getElementById('alertBox');
        box.textContent = msg;
        box.className = type;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 3000);
    }

    function renderTable() {
        const tbody = document.querySelector('#myTable tbody');
        tbody.innerHTML = '';
        tableData.forEach((row, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.col1}</td>
                <td>${row.col2}</td>
                <td>${row.col3}</td>
                <td><button onclick="deleteRow(${i})">Х</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteRow(index) {
        tableData.splice(index, 1);
        renderTable();
        saveData(); // Автосохранение после удаления
    }

    /* --- АВТОМАТИЧЕСКОЕ СОХРАНЕНИЕ --- */
    async function saveData() {
        try {
            // URL для запуска workflow_dispatch
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                    // Токен НЕ НУЖЕН, если Action публичный, но нужен auth для запуска workflow
                    // ВНИМАНИЕ: Чтобы это сработало без токена, нужно использовать Personal Access Token в заголовках
                    // НО мы не хотим его в HTML. 
                    // РЕШЕНИЕ: Используем Public Gist для чтения, а для записи просим Action.
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        json_data: JSON.stringify(tableData),
                        secret_key: WEBHOOK_SECRET
                    }
                })
            });

            if (response.ok) {
                showAlert('✅ Данные отправлены на сохранение!');
            } else {
                const err = await response.json();
                showAlert('❌ Ошибка: ' + err.message, 'error');
            }
        } catch (e) {
            showAlert('❌ Сетевая ошибка.', 'error');
        }
    }

    /* --- ЗАГРУЗКА ДАННЫХ (из data.json) --- */
    async function loadData() {
        try {
            const res = await fetch('data.json?t=' + Date.now());
            if (!res.ok) throw new Error('File not found');
            const data = await res.json();
            tableData = data;
            renderTable();
            showAlert('📥 Данные загружены.');
        } catch (e) {
            tableData = [];
            renderTable();
        }
    }

    /* --- ОБРАБОТЧИКИ --- */
    document.getElementById('addBtn').addEventListener('click', () => {
        const c1 = document.getElementById('newCol1').value.trim();
        const c2 = document.getElementById('newCol2').value.trim();
        const c3 = document.getElementById('newCol3').value.trim();
        if (!c1 || !c2 || !c3) return;

        tableData.push({ col1: c1, col2: c2, col3: c3 });
        renderTable();
        
        // Очищаем поля
        document.getElementById('newCol1').value = '';
        document.getElementById('newCol2').value = '';
        document.getElementById('newCol3').value = '';

        // Автоматически сохраняем
        saveData();
    });

    document.getElementById('updateBtn').addEventListener('click', loadData);

    // Старт
    loadData();
</script>

</body>
</html>
