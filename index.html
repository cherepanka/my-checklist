<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чек-лист: Ситуация — Решение — Цель</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Verdana, Geneva, sans-serif; background-color: #f8f9fa; box-sizing: border-box; }
        *, *::before, *::after { box-sizing: inherit; }
        .container { width: 100vw; height: 100vh; padding: 20px; background-color: #f8f9fa; overflow: auto; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; }
        .wrapper { width: 100%; max-width: 1600px; background: white; padding: 32px 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid #e5e7eb; }
        h2 { margin-top: 0; margin-bottom: 32px; color: #1e293b; font-size: 28px; font-weight: 700; text-align: center; }
        .format-info { background-color: #e0f2f1; border-left: 5px solid #00b48f; padding: 16px 22px; margin-bottom: 32px; border-radius: 10px; font-size: 16px; color: #004349; }
        .action-buttons { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center; }
        .action-buttons button { padding: 8px 16px; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; transition: transform 0.15s, box-shadow 0.2s, background-color 0.2s; display: flex; align-items: center; gap: 6px; }
        .action-buttons button:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        #addBtn { background-color: #16a34a; color: white; }
        #editSaveBtn { background-color: #d97706; color: white; }
        #cancelEditBtn { background-color: #6b7280; color: white; }
        #saveBtn { background-color: #2563eb; color: white; }
        #updateBtn { background-color: #374151; color: white; }
        .input-row { display: flex; gap: 14px; margin-bottom: 32px; align-items: center; flex-wrap: wrap; }
        .input-row input { padding: 14px 18px; border: 2px solid #cbd5e1; border-radius: 12px; flex-grow: 1; flex-basis: 260px; font-size: 16px; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-row input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); background-color: #f8fafc; }
        #searchInput { width: 100%; max-width: 450px; padding: 14px 18px; border-radius: 12px; border: 2px solid #cbd5e1; box-sizing: border-box; font-size: 16px; }
        
        table { width: 100%; border-collapse: collapse; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; background: white; font-size: 16px; table-layout: fixed; }
        thead { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border-bottom: 3px solid #047857; }
        th { padding: 16px 20px; text-align: left; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 2; border-right: 1px solid rgba(255,255,255,0.4); }
        th:first-child { width: 1fr; border-right: 3px solid #fecdd3; }
        th:nth-child(2) { width: 2fr; }
        th:nth-child(3) { width: 1fr; border-right: 3px solid #bae6fd; }
        th:last-child { width: 80px; border-right: none; text-align: center; }
        
        tbody tr { display: grid; grid-template-columns: 1fr 2fr 1fr 160px; align-items: center; border-bottom: 1px solid #f1f5f9; transition: background-color 0.2s; }
        tbody tr:hover { background-color: #f8fafc; }
        tbody tr:last-child { border-bottom: none; }
        
        td { padding: 14px 18px; text-align: left; word-wrap: break-word; color: #475569; min-height: 52px; position: relative; line-height: 1.6; border-right: 1px solid #f1f5f9; }
        td:last-child { border-right: none; text-align: center; padding: 8px; }
        td:first-child { background-color: #fef2f2; font-weight: 700; color: #991b1b; border-right: 3px solid #fed7d7; }
        td:nth-child(2) { border-right: 1px solid #f1f5f9; }
        td:nth-child(3) { background-color: #f0fdf9; font-style: italic; color: #047857; border-right: 3px solid #bae6fd; }
        td:nth-child(4) { padding: 8px; background: #f8fafc; border-right: none; }

        .action-buttons-cell { display: flex; gap: 4px; padding: 0; justify-content: center; flex-wrap: wrap; }
        .edit-btn, .delete-btn, .move-up-btn, .move-down-btn { padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 500; transition: transform 0.1s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; min-width: 50px; height: 30px; }
        .edit-btn { background-color: #dbeafe; color: #1e40af; }
        .edit-btn:hover { background-color: #bfdbfe; transform: scale(1.07); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .delete-btn { background-color: #fee2e2; color: #b91c1c; }
        .delete-btn:hover { background-color: #fecaca; transform: scale(1.07); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .move-up-btn { background-color: #f3f4f7; color: #374151; }
        .move-up-btn:hover { background-color: #e5e7eb; transform: scale(1.07); }
        .move-down-btn { background-color: #f3f4f7; color: #374151; }
        .move-down-btn:hover { background-color: #e5e7eb; transform: scale(1.07); }
        
        td[contenteditable="true"] { cursor: text; outline: none; background-color: white !important; line-height: 1.6; padding: 14px 18px; border: 2px solid transparent; border-radius: 8px; }
        td[contenteditable="true"]:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); background-color: #f8fafc !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="wrapper">
        <h2>📋 Чек-лист: Маркировка</h2>
        <div class="format-info"><strong>Как пользоваться:</strong> <code>&lt;b&gt;&lt;/b&gt;</code> — жирный, <code>&lt;i&gt;&lt;/i&gt;</code> — курсив, <code>&lt;u&gt;&lt;/u&gt;</code> — подчеркнутый, <code>&lt;br&gt;</code> — новая строка </div>

        <div id="mainPanel">
            <div id="alertBox"></div>
            
            <div class="action-buttons">
                <button id="updateBtn">🔄 Обновить данные</button>
                <button id="saveBtn">💾 Сохранить на сервер</button>
            </div>

            <div class="token-block">
                <input type="password" id="tokenInput" placeholder="🔑 GitHub-токен (personal access token)">
                <button id="tokenConnectBtn">Подключить</button>
                <button id="tokenDisconnectBtn" style="display: none;">🔓 Отключить</button>
                <span id="tokenStatus"></span>
            </div>

            <div class="input-row">
                <input type="text" id="newCol1" placeholder="❗ Ситуация (что случилось)">
                <input type="text" id="newCol2" placeholder="🛠️ Решение (как исправить)">
                <input type="text" id="newCol3" placeholder="🎯 Цель (зачем это делать)">
                <button id="addBtn">➕ Добавить запись</button>
                <button id="editSaveBtn" style="display: none;">✅ Сохранить изменения</button>
                <button id="cancelEditBtn" style="display: none;">❌ Отмена</button>
            </div>

            <div style="margin-bottom: 32px;">
                <input type="text" id="searchInput" placeholder="🔎 Поиск по чек-листу...">
            </div>

            <table id="myTable"><thead><tr><th>🚩 Ситуация</th><th>🛠️ Решение</th><th>🎯 Цель</th><th>Управление</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
    const GIST_ID = '0fed9ed549009aa81461d291686d4f50';
    const FILENAME = 'data.json';
    const LOCAL_KEY = 'checklistLocalData';
    const TOKEN_KEY = 'checklistGithubToken';

    let tableData = [];
    let editingIndex = null;
    let authToken = '';
    let currentFileSHA = '';

    function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(tableData)); } catch (e) { console.error('Ошибка локального сохранения:', e); } }
    function loadLocal() { try { const raw = localStorage.getItem(LOCAL_KEY); const data = raw ? JSON.parse(raw) : null; return Array.isArray(data) ? data : null; } catch (e) { return null; } }

    function showAlert(message, type = 'info') { 
        const box = document.getElementById('alertBox'); 
        if(box){ box.className = `status ${type}`; box.textContent = message; box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 3000); }
    }

    function renderTable(data) {
        const tbody = document.querySelector('#myTable tbody');
        if(tbody){
            tbody.innerHTML = '';
            data.forEach((row, index) => {
                const newRow = tbody.insertRow();
                const cell1 = newRow.insertCell(); cell1.innerHTML = row.col1 || ''; cell1.setAttribute('contenteditable', 'true');
                const cell2 = newRow.insertCell(); cell2.innerHTML = row.col2 || ''; cell2.setAttribute('contenteditable', 'true');
                const cell3 = newRow.insertCell(); cell3.innerHTML = row.col3 || ''; cell3.setAttribute('contenteditable', 'true');
                const cell4 = newRow.insertCell(); 
                const actionsDiv = document.createElement('div'); actionsDiv.className = 'action-buttons-cell';
                const upLink = document.createElement('a'); upLink.href = '#'; upLink.innerHTML = '▲'; upLink.className = 'move-up-btn';
                upLink.onclick = (e) => { e.preventDefault(); moveRow(index, 'up'); }; if (index === 0) upLink.style.display = 'none';
                const downLink = document.createElement('a'); downLink.href = '#'; downLink.innerHTML = '▼'; downLink.className = 'move-down-btn';
                downLink.onclick = (e) => { e.preventDefault(); moveRow(index, 'down'); }; if (index === data.length - 1) downLink.style.display = 'none';
                const editLink = document.createElement('a'); editLink.href = '#'; editLink.textContent = 'Ред.'; editLink.className = 'edit-btn';
                editLink.onclick = (e) => { e.preventDefault(); startEditing(index); };
                const delLink = document.createElement('a'); delLink.href = '#'; delLink.textContent = 'Х'; delLink.className = 'delete-btn';
                delLink.onclick = (e) => { e.preventDefault(); if (confirm('Удалить?')) { tableData.splice(index, 1); cancelEditing(); renderTable(tableData); saveLocal(); showAlert('Пункт удален.', 'info'); } };
                actionsDiv.appendChild(upLink); actionsDiv.appendChild(downLink); actionsDiv.appendChild(editLink); actionsDiv.appendChild(delLink); 
                cell4.appendChild(actionsDiv);
            });
        }
    }

    function moveRow(index, direction) { if (direction === 'up' && index > 0) { [tableData[index], tableData[index - 1]] = [tableData[index - 1], tableData[index]]; renderTable(tableData); saveLocal(); showAlert('Строка перемещена вверх.', 'info'); } if (direction === 'down' && index < tableData.length - 1) { [tableData[index], tableData[index + 1]] = [tableData[index + 1], tableData[index]]; renderTable(tableData); saveLocal(); showAlert('Строка перемещена вниз.', 'info'); } }
    function startEditing(index) { editingIndex = index; const row = tableData[index]; document.getElementById('newCol1').value = row.col1 || ''; document.getElementById('newCol2').value = row.col2 || ''; document.getElementById('newCol3').value = row.col3 || ''; document.getElementById('addBtn').style.display = 'none'; document.getElementById('editSaveBtn').style.display = 'inline-block'; document.getElementById('cancelEditBtn').style.display = 'inline-block'; }
    function cancelEditing() { editingIndex = null; document.getElementById('newCol1').value = ''; document.getElementById('newCol2').value = ''; document.getElementById('newCol3').value = ''; document.getElementById('addBtn').style.display = 'inline-block'; document.getElementById('editSaveBtn').style.display = 'none'; document.getElementById('cancelEditBtn').style.display = 'none'; }
    function filterTable() { const filter = document.getElementById('searchInput').value.toLowerCase(); const rows = document.querySelectorAll('#myTable tbody tr'); rows.forEach(row => { const text = row.textContent.toLowerCase(); row.style.display = text.includes(filter) ? '' : 'none'; }); }
    function handleKeyDown(e) { const active = document.activeElement; if (active && active.getAttribute('contenteditable') === 'true') { if (e.ctrlKey && e.key === 'b') { e.preventDefault(); wrapSelection('b'); } if (e.ctrlKey && e.key === 'i') { e.preventDefault(); wrapSelection('i'); } if (e.ctrlKey && e.key === 'u') { e.preventDefault(); wrapSelection('u'); } if (e.shiftKey && e.key === 'Enter') { e.preventDefault(); document.execCommand('insertHTML', false, '<br>'); } if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); } } }

    async function loadFromGist(showMessage = true) {
        try {
            const metaRes = await fetch(`https://api.github.com/gists/${GIST_ID}`);
            const gist = await metaRes.json();
            if (!gist.files || !gist.files[FILENAME]) { 
                showAlert('❌ Файл не найден на сервере.', 'error'); 
                return; 
            }
            currentFileSHA = gist.files[FILENAME].sha; // Сохраняем SHA сразу
            
            const fileUrl = gist.files[FILENAME].raw_url + `?t=${Date.now()}`;
            const raw = await fetch(fileUrl);
            const text = await raw.text();
            const loadedData = JSON.parse(text);

            tableData = loadedData;
            renderTable(tableData);
            saveLocal();
            if (showMessage) showAlert('📥 Данные загружены.', 'success');
        } catch (e) {
            console.error(e);
            if (showMessage) showAlert('❌ Ошибка сети/GitHub.', 'error');
        }
    }

    async function saveToGist() {
        if (!authToken) { showAlert('❌ Токен не задан.', 'error'); return; }
        if (!currentFileSHA) { showAlert('❌ SHA не определен. Нажмите «Обновить».', 'error'); return; }

        const safeData = tableData.map(row => ({
            col1: (row.col1 || '').replace(/\"/g, "'").substring(0, 5000),
            col2: (row.col2 || '').replace(/\"/g, "'").substring(0, 5000),
            col3: (row.col3 || '').replace(/\"/g, "'").substring(0, 5000)
        }));

        const payload = { files: { [FILENAME]: { content: JSON.stringify(safeData, null, 2), sha: currentFileSHA } } };

        try {
            const saveRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${authToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (saveRes.status === 409) { 
                showAlert('❌ Конфликт версий. Нажмите «Обновить».', 'error'); 
                document.getElementById('saveBtn').disabled = true; 
                return; 
            }
            if (!saveRes.ok) { 
                const errorText = await saveRes.text(); 
                console.error("Save Error:", saveRes.status, errorText);
                if (saveRes.status === 401) { showAlert('❌ Ошибка 401: неверный токен.', 'error'); }
                else { showAlert(`❌ Ошибка ${saveRes.status}`, 'error'); }
                return; 
            }

            const updatedGist = await saveRes.json();
            currentFileSHA = updatedGist.files[FILENAME].sha;
            showAlert('✅ Сохранено.', 'success');
        } catch (e) {
            console.error("Network Error:", e);
            showAlert('❌ Ошибка сети.', 'error');
        }
    }

    /* --- Инициализация --- */
    document.getElementById('addBtn').addEventListener('click', () => {
        const c1 = document.getElementById('newCol1').value.trim();
        const c2 = document.getElementById('newCol2').value.trim();
        const c3 = document.getElementById('newCol3').value.trim();
        if (!c1 && !c2 && !c3) return;
        tableData.unshift({ col1: c1, col2: c2, col3: c3 }); 
        renderTable(tableData);
        cancelEditing();
        saveLocal();
        showAlert('Запись добавлена.', 'success');
    });

    document.getElementById('editSaveBtn').addEventListener('click', () => {
        if (editingIndex === null) return;
        const c1 = document.getElementById('newCol1').value.trim();
        const c2 = document.getElementById('newCol2').value.trim();
        const c3 = document.getElementById('newCol3').value.trim();
        if (!c1 && !c2 && !c3) return;
        tableData[editingIndex] = { col1: c1, col2: c2, col3: c3 };
        renderTable(tableData);
        cancelEditing();
        saveLocal();
        showAlert('Пункт обновлен.', 'success');
    });

    document.getElementById('cancelEditBtn').addEventListener('click', cancelEditing);
    document.getElementById('searchInput').addEventListener('input', filterTable);
    document.addEventListener('keydown', handleKeyDown);
    document.querySelector('#myTable tbody').addEventListener('input', (e) => {
        const td = e.target.closest('td');
        if (!td || td.getAttribute('contenteditable') !== 'true') return;
        const tr = td.closest('tr');
        const idx = Array.prototype.indexOf.call(tr.parentNode.children, tr);
        if (idx < 0 || !tableData[idx]) return;
        tableData[idx]['col' + (td.cellIndex + 1)] = td.innerHTML;
        saveLocal();
    });

    document.getElementById('updateBtn').addEventListener('click', () => {
        if (tableData.length && !confirm('Заменить локальные данные серверными?')) return;
        loadFromGist();
    });

    document.getElementById('saveBtn').addEventListener('click', saveToGist);

    /* --- ТОКЕН: Исправленная логика отображения --- */
    function updateTokenUI() {
        if (authToken) {
            if(document.getElementById('tokenConnectBtn')) document.getElementById('tokenConnectBtn').style.display = 'none';
            if(document.getElementById('tokenDisconnectBtn')) document.getElementById('tokenDisconnectBtn').style.display = 'inline-block';
            if(document.getElementById('tokenStatus')) document.getElementById('tokenStatus').textContent = '✅ Токен подключен';
        } else {
            if(document.getElementById('tokenConnectBtn')) document.getElementById('tokenConnectBtn').style.display = 'inline-block';
            if(document.getElementById('tokenDisconnectBtn')) document.getElementById('tokenDisconnectBtn').style.display = 'none';
            if(document.getElementById('tokenStatus')) document.getElementById('tokenStatus').textContent = '';
        }
    }

    if(document.getElementById('tokenConnectBtn')) document.getElementById('tokenConnectBtn').addEventListener('click', () => {
        const val = document.getElementById('tokenInput').value.trim();
        if (!val) { showAlert('Введите токен.', 'error'); return; }
        authToken = val;
        localStorage.setItem(TOKEN_KEY, val);
        updateTokenUI();
        showAlert('✅ Токен подключен.', 'success');
    });

    if(document.getElementById('tokenInput')) document.getElementById('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('tokenConnectBtn').click(); });
    if(document.getElementById('tokenDisconnectBtn')) document.getElementById('tokenDisconnectBtn').addEventListener('click', () => { authToken = ''; localStorage.removeItem(TOKEN_KEY); updateTokenUI(); showAlert('Токен отключен.', 'info'); });

    updateTokenUI();

    const localData = loadLocal();
    if (localData && localData.length) {
        tableData = localData;
        renderTable(tableData);
    } else {
        loadFromGist();
    }

</script>

</body>
</html>
