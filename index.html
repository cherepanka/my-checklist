<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек-лист</title>
    <style>
        /* Стили для формы ввода токена */
        .token-input {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        #githubToken {
            width: 300px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>📋 Чек-лист: Ситуация — Решение — Цель</h1>

    <!-- Блок для работы с токеном -->
    <div class="token-input">
        <input type="text" id="githubToken" placeholder="Введите GitHub токен">
        <button id="connectToken">Подключить токен</button>
        <button id="disconnectToken" style="display:none;">Отключить токен</button>
        <span id="tokenStatus"></span>
    </div>

    <!-- Основные кнопки управления -->
    <button id="refreshData">🔄 Обновить данные</button>
    <button id="saveToServer">💾 Сохранить на сервер</button>

    <!-- Кнопка добавления новой записи -->
    <button id="addEntry">➕ Добавить запись</button>

    <!-- Сохранение изменений -->
    <button id="saveChanges">✅ Сохранить изменения</button>
    <button id="cancel">❌ Отмена</button>

    <!-- Основная область для чек-листа -->
    <div id="checklist">
        <!-- Здесь будет отображаться список -->
    </div>

    <script>
        // Переменная для хранения токена
        let githubToken = null;

        // Функция для получения токена из локального хранилища
        function getStoredToken() {
            return localStorage.getItem('githubToken');
        }

        // Функция для сохранения токена
        function saveToken(token) {
            localStorage.setItem('githubToken', token);
            updateTokenUI(true);
        }

        // Функция для удаления токена
        function removeToken() {
            localStorage.removeItem('githubToken');
            githubToken = null;
            updateTokenUI(false);
        }

        // Обновление интерфейса токена
        function updateTokenUI(isConnected) {
            const tokenInput = document.getElementById('githubToken');
            const connectButton = document.getElementById('connectToken');
            const disconnectButton = document.getElementById('disconnectToken');
            const tokenStatus = document.getElementById('tokenStatus');

            if (isConnected) {
                tokenInput.style.display = 'none';
                connectButton.style.display = 'none';
                disconnectButton.style.display = 'inline-block';
                tokenStatus.textContent = '✅ Токен подключен';
            } else {
                tokenInput.style.display = 'inline-block';
                connectButton.style.display = 'inline-block';
                disconnectButton.style.display = 'none';
                tokenStatus.textContent = '';
            }
        }

        // Обработчик подключения токена
        document.getElementById('connectToken').addEventListener('click', () => {
            const token = document.getElementById('githubToken').value.trim();
            if (token) {
                saveToken(token);
                githubToken = token;
            }
        });

        // Обработчик отключения токена
        document.getElementById('disconnectToken').addEventListener('click', () => {
            removeToken();
            githubToken = null;
        });

        // При загрузке страницы проверяем сохраненный токен
        window.addEventListener('load', () => {
            githubToken = getStoredToken();
            updateTokenUI(!!githubToken);
        });

        // Здесь должен быть остальной код работы с чек-листом...
    </script>
</body>
</html>
