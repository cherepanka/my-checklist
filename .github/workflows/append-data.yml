name: Webhook Listener (Save to Gist)

on:
  workflow_call:
    inputs:
      data:
        required: true
        type: string
    secrets:
      GIST_TOKEN:
        required: true
      GIST_ID:
        required: true

jobs:
  save-to-gist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout (необязательно, но полезно для логов)
        uses: actions/checkout@v4

      - name: Parse and Save JSON
        env:
          GIST_ID: ${{ inputs.GIST_ID || '0fed9ed549009aa81461d291686d4f50' }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "Получен вызов workflow_call..."
          
          # Проверяем, пришел ли секрет
          if [ -z "$GIST_TOKEN" ]; then
            echo "❌ Ошибка: Секрет GIST_TOKEN не найден в настройках репозитория."
            exit 1
          fi

          # Читаем JSON из входных данных
          echo "${{ inputs.data }}" > temp_input.json
          
          # Формируем payload для Gist
          CONTENT=$(cat temp_input.json)
          PAYLOAD="{\"files\":{\"data.json\":{\"content\":\"$CONTENT\"}}}"
          
          echo "Отправка данных в Gist..."
          
          # Отправляем PATCH запрос
          curl -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/gists/$GIST_ID"
          
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Curl завершился с ошибкой: $EXIT_CODE"
            exit 1
          fi
          
          echo "✅ Данные успешно отправлены в Gist."
