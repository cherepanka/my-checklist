name: Save Checklist to Gist

on:
  workflow_call:
    inputs:
      payload:
        required: true
        type: string
    secrets:
      GIST_TOKEN:
        required: true
      GIST_ID:
        required: true

jobs:
  update-gist:
    runs-on: ubuntu-latest
    permissions: {} # Минимальные права
    
    steps:
      - name: Update Gist
        env:
          TOKEN: ${{ secrets.GIST_TOKEN }}
          ID: ${{ secrets.GIST_ID }}
          DATA: ${{ inputs.payload }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Error: Token is missing"
            exit 1
          fi
          
          # Формируем JSON для API GitHub
          PAYLOAD=$(printf '{"files":{"data.json":{"content":%s}}}' "$DATA")
          
          # Отправляем запрос
          curl --retry 3 --retry-delay 2 \
            -X PATCH \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD" \
            "https://api.github.com/gists/$ID"
          
          if [ $? -ne 0 ]; then
            echo "Curl request failed"
            exit 1
          fi
