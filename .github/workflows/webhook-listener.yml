name: Webhook Listener for Checklist

on:
  workflow_dispatch: # Позволяет запускать вручную (для тестов)
  repository_dispatch: # Если вы все же решите использовать dispatch
  # ЛУЧШЕЕ РЕШЕНИЕ: Используем workflow_call, чтобы вызывать его как функцию
  # Но для браузера проще всего использовать "public endpoint" через workflow_dispatch 
  # с секретом в URL (небезопасно) или через стандартный workflow_run.
  
# Самый надежный способ для браузера: 
# Мы создаем workflow, который принимает данные через "Input" и делает коммит.
# Но GitHub не дает запускать workflows из браузера напрямую без токена.

# --- ВЫХОД ИЗ СИТУАЦИИ: Используем сторонний прокси-сервис (Webhook.site или Pipedream) ---
# ИЛИ используем Pages + JS + Action (сложная связка)

# Давайте используем самый простой рабочий вариант: Action, который делает коммит.
# Но его нельзя запустить из браузера БЕЗ токена.

# ПРАВИЛЬНОЕ РЕШЕНИЕ ДЛЯ БРАУЗЕРА (без токена в коде):
# Используем сервис "Incoming Webhook" (например, Pipedream.com)
