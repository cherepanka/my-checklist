name: Update Gist Checklist

on:
  push:
    paths:
      - 'data.json' # Запускать только если изменился файл с данными

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Gist
        uses: exiasria/action-update-gist@v1
        with:
          id: 0fed9ed549009aa81461d291686d4f50 # ID вашего Gist
          file: data.json # Имя файла внутри Gist, который нужно заменить
          token: ${{ secrets.token }} # Секрет, который мы создали в Шаге 2
